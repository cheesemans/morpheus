<div
  data-signals="{cf_morph_value: '#f97316'}"
  class="color-field-morph-panel"
>
  <neo-color-field
    value="#f97316"
    disabled
    aria-label="Accent color"
    data-attr:value="$cf_morph_value"
    data-on:neo-color-field-input="$cf_morph_value = evt.detail.value"
  ></neo-color-field>
  <p class="color-field-morph-row">
    <span
      aria-hidden="true"
      class="color-field-morph-swatch"
      style="background: #f97316"
      data-attr:style="'background: ' + $cf_morph_value"
    ></span>
    <code data-text="$cf_morph_value">#f97316</code>
  </p>
</div>
